# API + Qdrant, plus an optional vLLM server (profile "vllm", needs an NVIDIA GPU
# and nvidia-container-toolkit):
#
#   docker compose up -d --build --wait                      # extractive answers
#   RAG_LLM_BASE_URL=http://vllm:8000/v1 docker compose --profile vllm up -d --build
#   MULTILINGUAL=1 RAG_RETRIEVER=hybrid-multilingual docker compose up -d --build
#
# Without a GPU, point RAG_LLM_BASE_URL at any other OpenAI-compatible API.
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      args:
        MULTILINGUAL: ${MULTILINGUAL:-0}
    environment:
      RAG_RETRIEVER: ${RAG_RETRIEVER:-hybrid-hashing}
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_LLM_BASE_URL: ${RAG_LLM_BASE_URL:-}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}
      RAG_LLM_API_KEY: ${RAG_LLM_API_KEY:-}
    ports: ["8080:8080"]
    volumes: ["hf-cache:/home/rag/.cache/huggingface"]
    depends_on:
      qdrant: {condition: service_healthy}

  vllm:
    profiles: ["vllm"]
    image: vllm/vllm-openai:v0.8.5
    command: ["--model", "Qwen/Qwen2.5-1.5B-Instruct", "--max-model-len", "4096"]
    ports: ["8000:8000"]
    volumes: ["vllm-cache:/root/.cache/huggingface"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

volumes:
  qdrant-data:
  hf-cache:
  vllm-cache:
